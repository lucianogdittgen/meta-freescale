name: OE Lint

on:
  pull_request:
  merge_group:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oelint:
    runs-on: ubuntu-latest
    steps:
      - uses: ossystems/nix-actions@v1
        with:
          install-nix: true
          flake-check: false
          build-hosts: false
          build-devshells: false
          devshell: github:OSSystems/yocto-env.nix#lint
          # Ratchet against the committed baseline: fail only on findings that
          # are NOT already accepted, so the existing residual is allowed to
          # stand while regressions are blocked. Regenerate the baseline with
          # 'contrib/oelint/oelint-ratchet.sh --update' after an intentional
          # change to the finding set.
          run: ./contrib/oelint/oelint-ratchet.sh
